name: Opus — Build on Linux

on:
  push:
    branches:
      - gh-actions
  pull_request:

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          # build tools
          sudo apt-get install -y build-essential cmake git

      # 3) Configure CMake
      - name: Configure CMake
        run: |
          ./configure CC="gcc" --enable-deep-plc

      # 4) Build
      - name: Build
        run: |
          make

      # 5) Run tests
      - name: Run tests
        run: |
          make check

      # 6) Upload libopus.a
      - name: Upload libopus.a
        uses: actions/upload-artifact@v4
        with:
          name: opus-${{ runner.os }}
          run: mv .libs/libopus.a libopus.a
          path: |
            libopus.a
            include/opus_custom.h
            include/opus_defines.h
            include/opus_multistream.h
            include/opus_projection.h
            include/opus_types.h
            include/opus.h
