name: Opus — Build on Windows

on:
  push:
    branches:
      - gh-actions
  pull_request:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64        # or MSYS or MINGW32 depending on your needs
          update: true            # run pacman -Syu (the action handles the restart dance)
          install: >
            base-devel
            autoconf
            automake
            gcc
            m4
            perl
            pkg-config
            libtool

      - name: Debug workspace & run make (MSYS2)
        shell: msys2 {0}
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ./configure --enable-deep-plc
          make
          make check

      # Move libopus.a for packaging
      - name: Move libopus.a
        run: |
          mv -v .libs/libopus.a libopus.a

      # Upload libopus.a and headers
      - name: Upload libopus.a and headers
        uses: actions/upload-artifact@v4
        with:
          name: opus-${{ runner.os }}
          path: |
            libopus.a
            include/opus_custom.h
            include/opus_defines.h
            include/opus_multistream.h
            include/opus_projection.h
            include/opus_types.h
            include/opus.h
