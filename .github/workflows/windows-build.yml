name: Opus — Build on Windows

on:
  push:
    branches:
      - gh-actions
  pull_request:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      # 1) Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Configure CMake
      - name: Configure CMake
        run: |
          .\configure
          ls -l Makefile

      # 3) Build
      - name: Build
        run: |
          make

      # 4) Run tests
      - name: Run tests
        run: |
          make check

      # 5) Move libopus.a for packaging
      - name: Move libopus.a
        run: |
          mv -v .libs/libopus.a libopus.a

      # 6) Upload libopus.a and headers
      - name: Upload libopus.a and headers
        uses: actions/upload-artifact@v4
        with:
          name: opus-${{ runner.os }}
          path: |
            libopus.a
            include/opus_custom.h
            include/opus_defines.h
            include/opus_multistream.h
            include/opus_projection.h
            include/opus_types.h
            include/opus.h
