name: Opus — Build on Windows

on:
  push:
    branches:
      - gh-actions
  pull_request:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      # 1) Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure Chocolatey is installed
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "Chocolatey not found — installing..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            # Ensure choco is on PATH for the rest of this job
            $chocoBin = Join-Path $env:ALLUSERSPROFILE 'chocolatey\bin'
            $env:PATH = "$chocoBin;$env:PATH"
            Write-Host "Chocolatey installed: $(choco --version)"
          } else {
            Write-Host "Chocolatey already installed: $(choco --version)"
          }

      # 2) Configure CMake
      - name: Configure CMake
        run: |
          .\configure
          ls -l Makefile

      # 3) Build
      - name: Build
        run: |
          make

      # 4) Run tests
      - name: Run tests
        run: |
          make check

      # 5) Move libopus.a for packaging
      - name: Move libopus.a
        run: |
          mv -v .libs/libopus.a libopus.a

      # 6) Upload libopus.a and headers
      - name: Upload libopus.a and headers
        uses: actions/upload-artifact@v4
        with:
          name: opus-${{ runner.os }}
          path: |
            libopus.a
            include/opus_custom.h
            include/opus_defines.h
            include/opus_multistream.h
            include/opus_projection.h
            include/opus_types.h
            include/opus.h
