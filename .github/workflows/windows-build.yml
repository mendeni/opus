name: Opus — Build on Windows

on:
  push:
    branches:
      - gh-actions-windows
  pull_request:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Cmake
        run: cmake -S opus -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF -DOPUS_ENABLE_DEEP_PLC=ON

      - name: Build Standalone
        run: cmake --build build --config Release

      - name: Find
        shell: bash
        run: |
          find . -type f

      # - name: Move libs
      #   run: |
      #     mv -v .libs/opus.lib opus.lib

      - name: Upload libopus.a and headers
        uses: actions/upload-artifact@v4
        with:
          name: opus-${{ runner.os }}
          path: |
            opus.lib
            include/opus_custom.h
            include/opus_defines.h
            include/opus_multistream.h
            include/opus_projection.h
            include/opus_types.h
            include/opus.h
