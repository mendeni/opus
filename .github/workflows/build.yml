# Unified build for Linux, macOS and Windows
name: Opus — Build (matrix)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git autoconf automake libtool m4 pkg-config perl

      - name: Install GNU autotools (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install autoconf automake libtool m4 pkg-config --force

      - name: Prepare autotools
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        run: |
          autoreconf -fi
        shell: bash

      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: |
          ./configure CC="gcc" --enable-deep-dred
        shell: bash

      - name: Configure (macOS)
        if: matrix.platform == 'macos'
        run: |
          ./configure CC="gcc -arch x86_64 -arch arm64" --enable-dred
        shell: bash

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=OFF -DOPUS_ENABLE_DRED=ON

      - name: Build & Test (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          make
          make check
        shell: bash

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: cmake --build build --config Release

      - name: Move libopus.a (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          mv -v .libs/libopus.a libopus.a
        shell: bash

      - name: Inspect & strip libopus.a (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -eux
          # Ensure libopus.a is present (Move step usually placed it)
          if [ ! -f libopus.a ]; then
            echo "libopus.a not found in workspace; attempting to move from .libs/"
            ls -la .libs || true
            mv -v .libs/libopus.a libopus.a || true
          fi
      
          echo "File info for libopus.a:"
          file libopus.a || true
      
          echo "Lipo info (architectures):"
          lipo -info libopus.a || true
      
          echo "Size before strip:"
          du -h libopus.a || true
      
          echo "Extracting archive members (to find largest objects):"
          mkdir -p objs
          cd objs
          ar -x ../libopus.a || true
          # list largest object files
          ls -lS *.o 2>/dev/null | head -n 20 || true
          cd ..
      
          echo "Attempting to strip unnecessary symbols from libopus.a (macOS strip):"
          # macOS strip; -x removes local symbols
          strip -x libopus.a || echo "strip failed or strip not available"
      
          echo "Size after strip:"
          du -h libopus.a || true
        shell: bash
      
      - name: Inspect & strip opus.lib (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Install LLVM (includes llvm-objcopy). Chocolatey is available on windows-latest.
          choco install llvm --no-progress -y
      
          # Prefer ProgramFiles LLVM path, fall back to ProgramFiles(x86)
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (!(Test-Path $llvmBin)) {
            $llvmBin = Join-Path $env:'ProgramFiles(x86)' 'LLVM\bin'
          }
          $env:PATH = "$llvmBin;$env:PATH"
      
          Write-Host "llvm-objcopy location:"
          Get-Command llvm-objcopy -ErrorAction SilentlyContinue | Format-List -Property Path,Version
      
          Write-Host "llvm-objcopy version:"
          llvm-objcopy --version
      
          $libPath = 'build/Release/opus.lib'
          if (-not (Test-Path $libPath)) {
            Write-Host "opus.lib not found at $libPath. Listing build/Release for debugging:"
            Get-ChildItem -Path build\Release -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 40
            exit 1
          }
      
          Write-Host "Before strip (name and size):"
          Get-Item $libPath | Select-Object Name,Length
      
          # Strip unneeded symbols from COFF archive. Specify input/output targets to be explicit.
          llvm-objcopy --input-target=coff-x86-64 --output-target=coff-x86-64 --strip-unneeded $libPath
      
          Write-Host "After strip (name and size):"
          Get-Item $libPath | Select-Object Name,Length

      - name: Upload libopus.a and headers (Linux/macOS)
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: opus-${{ runner.os }}
          path: |
            libopus.a
            include/opus_custom.h
            include/opus_defines.h
            include/opus_multistream.h
            include/opus_projection.h
            include/opus_types.h
            include/opus.h

      - name: Upload opus.lib and headers (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: opus-${{ runner.os }}
          path: |
            build/Release/opus.lib
            include/opus_custom.h
            include/opus_defines.h
            include/opus_multistream.h
            include/opus_projection.h
            include/opus_types.h
            include/opus.h
