name: Build & Test Opus (Linux, macOS, Windows)

on:
  push:
    branches:
      - gh-actions
  pull_request:

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build on Linux & macOS
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: ./configure CC="gcc -arch x86_64 -arch arm64" --enable-deep-plc && make

      # Build on Windows
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\configure CC="gcc -arch x86_64 --enable-deep-plc && make

      # ---- TEST STEP ----
      - name: Test binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          make test

      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        run: |
          make test

      # Upload artifacts
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opus-${{ runner.os }}
          path: |
            ./libs/libopus.a

